name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (留空默认自动同步最新 Release，例如 v1.0.0)'
        required: false
        default: ''
        type: string
      min_supported_version:
        description: '最低支持版本 (留空默认自动继承上一版本基线，例如 1.0.0)'
        required: false
        default: ''
        type: string
      notice_level:
        description: '提醒级别 (silent: 静默红点; dialog: 建议更新弹窗; force: 强制阻断)'
        required: false
        default: 'silent'
        type: choice
        options:
          - 'silent'
          - 'dialog'
          - 'force'
  repository_dispatch:
    types: [android-apk-built]

permissions:
  contents: write

jobs:
  release:
    name: Download APK and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: 确定目标 Release Tag 与提醒级别参数
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILDER_REPO="nodeauth/nodeauth-app-builder"
          RELEASE_NOTES_B64=""
          RELEASE_NOTES_MD_B64=""
          BUILDER_RUN_ID=""
          APK_NAME=""

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${{ github.event.client_payload.tag_name }}"
            MIN_VERSION="${{ github.event.client_payload.min_supported_version }}"
            NOTICE_LEVEL="${{ github.event.client_payload.notice_level }}"
            RELEASE_NOTES_B64="${{ github.event.client_payload.release_notes_b64 }}"
            RELEASE_NOTES_MD_B64="${{ github.event.client_payload.release_notes_md_b64 }}"
            BUILDER_RUN_ID="${{ github.event.client_payload.run_id }}"
            APK_NAME="${{ github.event.client_payload.apk_name }}"
            PAYLOAD_BUILDER_REPO="${{ github.event.client_payload.builder_repo }}"
            if [ -n "$PAYLOAD_BUILDER_REPO" ]; then
              BUILDER_REPO="$PAYLOAD_BUILDER_REPO"
            fi
          else
            TAG="${{ inputs.tag_name }}"
            MIN_VERSION="${{ inputs.min_supported_version }}"
            NOTICE_LEVEL="${{ inputs.notice_level }}"
          fi

          # 若留空，自动从 Builder 仓库最近成功运行的 Release 构建提取 Tag
          if [ -z "$TAG" ]; then
            echo "未指定 Tag，正在从 ${BUILDER_REPO} 获取最新成功构建信息..."
            TAG=$(gh run list --repo "$BUILDER_REPO" --workflow "build-android-apk.yml" --status success --limit 1 --json headBranch -q '.[0].headBranch' 2>/dev/null || echo "")
            # 若 headBranch 提取出的是 main 分支而非语义化版本号，进一步从 Artifact 名称探测版本
            if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
              LATEST_RUN_ID=$(gh run list --repo "$BUILDER_REPO" --workflow "build-android-apk.yml" --status success --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || echo "")
              if [ -n "$LATEST_RUN_ID" ]; then
                DETECTED_VER=$(gh run view "$LATEST_RUN_ID" --repo "$BUILDER_REPO" --json artifacts -q '.artifacts[0].name' 2>/dev/null | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' || echo "")
                if [ -n "$DETECTED_VER" ]; then
                  TAG="v$DETECTED_VER"
                fi
              fi
            fi
            if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
              TAG="v1.0.0"
            fi
          fi

          # 确保 Tag 统一规范带有 'v' 前缀
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac

          NOTICE_LEVEL=${NOTICE_LEVEL:-silent}

          echo "目标 Release: $TAG"
          echo "最低支持版本基线: ${MIN_VERSION:-'继承当前基线'}"
          echo "提醒级别: $NOTICE_LEVEL"
          echo "Builder Run ID: ${BUILDER_RUN_ID:-'未指定'}"
          echo "产物名称: ${APK_NAME:-'自动探测'}"

          echo "BUILDER_REPO=$BUILDER_REPO" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          echo "MIN_SUPPORTED_VERSION=$MIN_VERSION" >> $GITHUB_ENV
          echo "NOTICE_LEVEL=$NOTICE_LEVEL" >> $GITHUB_ENV
          echo "RELEASE_NOTES_B64=$RELEASE_NOTES_B64" >> $GITHUB_ENV
          echo "RELEASE_NOTES_MD_B64=$RELEASE_NOTES_MD_B64" >> $GITHUB_ENV
          echo "BUILDER_RUN_ID=$BUILDER_RUN_ID" >> $GITHUB_ENV
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: 从 Builder 仓库拉取 APK 构建产物并规范命名
        env:
          GH_TOKEN: ${{ secrets.MASTER_GITHUB_TOKEN || secrets.GH_PAT || secrets.BUILDER_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          echo "正在从 ${BUILDER_REPO} 下载 APK 构建产物..."

          # 1. 优先使用 Actions Artifact 机制原生下载（彻底无需上游发 Release）
          DOWNLOADED=false
          if [ -n "$BUILDER_RUN_ID" ]; then
            echo "正在从 Workflow Run (ID: ${BUILDER_RUN_ID}) 下载 Artifact [${APK_NAME}]..."
            if [ -n "$APK_NAME" ]; then
              gh run download "$BUILDER_RUN_ID" --repo "$BUILDER_REPO" --name "$APK_NAME" --dir dist && DOWNLOADED=true || true
            fi
            if [ "$DOWNLOADED" != "true" ]; then
              echo "指定名称下载未命中，尝试下载该 Run 下所有产物..."
              gh run download "$BUILDER_RUN_ID" --repo "$BUILDER_REPO" --dir dist && DOWNLOADED=true || true
            fi
          fi

          # 2. 兜底兼容：若为纯手动触发未携带 Run ID，尝试拉取最近一次成功的 Artifact
          if [ "$DOWNLOADED" != "true" ]; then
            echo "尝试从 ${BUILDER_REPO} 最近成功的构建下载 Artifact..."
            LATEST_RUN_ID=$(gh run list --repo "$BUILDER_REPO" --workflow "build-android-apk.yml" --status success --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || echo "")
            if [ -n "$LATEST_RUN_ID" ]; then
              gh run download "$LATEST_RUN_ID" --repo "$BUILDER_REPO" --dir dist && DOWNLOADED=true || true
            fi
          fi

          # 3. 整理并统一重命名为 NodeAuth-universal.apk
          SRC_APK=$(find dist -type f -name "*.apk" | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "错误: 未能获取到有效的 APK 产物文件!"
            exit 1
          fi

          if [ "$SRC_APK" != "dist/NodeAuth-universal.apk" ]; then
            mv "$SRC_APK" "dist/NodeAuth-universal.apk"
          fi

          echo "=== 准备发布以下 APK ==="
          ls -lh dist/*.apk

      - name: 准备多语言 Release 说明与安全校验和
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE="dist/NodeAuth-universal.apk"
          APK_SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          echo "APK_SHA256=$APK_SHA256" >> $GITHUB_ENV

          # 1. 解码上游结构化多语言 JSON (供后续通知 License 服务端使用)
          if [ -n "$RELEASE_NOTES_B64" ]; then
            echo "$RELEASE_NOTES_B64" | base64 --decode > /tmp/release_payload.json || true
          fi

          # 2. 直接解码上游生成的权威多语言 Markdown 说明 (100% 保持格式与多语言一致)
          if [ -n "$RELEASE_NOTES_MD_B64" ]; then
            echo "$RELEASE_NOTES_MD_B64" | base64 --decode > /tmp/release_notes.md || true
          fi

          # 3. 极简防御性兜底 (分别验证 Markdown 与 JSON 产物，确保两者均非空有效)
          if [ ! -s /tmp/release_notes.md ]; then
            printf '## 🚀 NodeAuth Android %s\n\n### ✨ 更新说明\n• 我们修复了一些错误并做了部分改进。\n\n---\n### 🌐 What'\''s New\n• We fixed bugs and made minor improvements.\n' "${{ env.TAG_NAME }}" > /tmp/release_notes.md
          fi
          if [ ! -s /tmp/release_payload.json ]; then
            echo '{"zh": "• 我们修复了一些错误并做了部分改进。", "en": "• We fixed bugs and made minor improvements."}' > /tmp/release_payload.json
          fi

      - name: 发布至 GitHub Release (nodeauth 官方唯一公开门户)
        id: release_gh
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          name: NodeAuth ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: dist/NodeAuth-universal.apk
          body_path: /tmp/release_notes.md

      - name: 通知 License 服务端同步最新 Android 版本资产
        env:
          WEBHOOK_SECRET: ${{ secrets.VERSION_WEBHOOK_SECRET }}
          LICENSE_API_URL: ${{ secrets.LICENSE_API_URL }}
          TAG_NAME: ${{ env.TAG_NAME }}
          MIN_SUPPORTED_VERSION: ${{ env.MIN_SUPPORTED_VERSION }}
          NOTICE_LEVEL: ${{ env.NOTICE_LEVEL }}
        run: |
          if [ -z "$LICENSE_API_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "⚠️ 未配置 LICENSE_API_URL 或 VERSION_WEBHOOK_SECRET，跳过向 License 服务端同步"
            exit 0
          fi
          echo "正在向 License 服务端上报新版本: ${TAG_NAME} (notice_level: ${NOTICE_LEVEL})..."
          CLEAN_VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
          DOWNLOAD_URL="https://github.com/nextmatrixllc/nodeauth/releases/download/${TAG_NAME}/NodeAuth-universal.apk"
          export CLEAN_VERSION
          export DOWNLOAD_URL

          python3 -c "
          import json, os, urllib.request, urllib.error

          api_base = os.environ['LICENSE_API_URL'].rstrip('/')
          api_url = f'{api_base}/api/v1/version/webhook/github-release'

          payload = {
              'product': 'nodeauth',
              'platform': 'android',
              'channel': 'github',
              'version': os.environ['CLEAN_VERSION'],
              'min_supported_version': os.environ.get('MIN_SUPPORTED_VERSION') or None,
              'notice_level': os.environ.get('NOTICE_LEVEL') or 'silent',
              'download_url': os.environ['DOWNLOAD_URL']
          }

          try:
              if os.path.exists('/tmp/release_payload.json'):
                  with open('/tmp/release_payload.json') as f:
                      payload['release_notes'] = json.load(f)
          except Exception as e:
              print('Load release notes payload error:', e)

          req = urllib.request.Request(
              api_url,
              data=json.dumps(payload).encode('utf-8'),
              headers={
                  'Content-Type': 'application/json',
                  'X-Webhook-Secret': os.environ['WEBHOOK_SECRET']
              }
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print('✅ License 服务端同步成功，状态码:', resp.status)
          except urllib.error.HTTPError as e:
              err_body = e.read().decode('utf-8', errors='ignore')
              print(f'⚠️ License 服务端同步 HTTP 错误 (状态码 {e.code}):', err_body)
          except Exception as e:
              print('⚠️ License 服务端同步异常:', e)
          "

